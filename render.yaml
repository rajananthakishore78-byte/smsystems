# Render blueprint for SM SYSTEMS (Express API + React static frontend).
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Secrets below are marked `sync: false`, so Render prompts you for each value
# during setup (copy them from server/.env). Never commit real values here.
services:
  - type: web
    name: smsystems
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm install --prefix ../client && npm --prefix ../client run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Build-time: bundled frontend inside the API uses same-origin /api
      - key: VITE_API_URL
        value: /api
      # Supabase PostgreSQL - use the IPv4 POOLER host (aws-0-<region>.pooler.supabase.com),
      # the direct db.* host is IPv6-only and fails on many hosts.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Supabase Auth + REST
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      # Comma-separated allowlist of admin emails (required: Supabase allows public signups)
      - key: ADMIN_EMAILS
        sync: false
      # Cloudinary image uploads
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Break-glass key for curl/scripts (x-admin-key header)
      - key: ADMIN_SECRET_KEY
        sync: false
      # Your frontend site URL (CORS allow-list); the API also allows any origin
      - key: CLIENT_URL
        sync: false
  # Frontend static site (https://smsystems-1.onrender.com).
  # Critical: VITE_API_URL must include /api suffix, and /* must rewrite
  # to /index.html or /admin/login will 404 on refresh/direct visit.
  - type: static
    name: smsystems-1
    buildCommand: npm install --prefix client && npm --prefix client run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://smsystems.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
